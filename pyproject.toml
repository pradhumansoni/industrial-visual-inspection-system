[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-visual-inspection-system"
version = "0.1.0"
description = "Research-grade Industrial Visual Inspection System built with PyTorch."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name = "Pradhuman Soni"}
]

license = {text = "MIT"}

keywords = [
    "computer-vision",
    "deep-learning",
    "pytorch",
    "industrial-ai",
    "surface-defect-detection",
    "machine-learning"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]